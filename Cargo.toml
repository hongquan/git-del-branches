[package]
name = "git-del-branches"
version = "1.0.0"
authors = ["Nguyễn Hồng Quân <ng.hong.quan@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2024"
description = "Git tool to select and delete multiple branches"
readme = "README.md"
homepage = "https://github.com/hongquan/git-del-branches"
repository = "https://github.com/hongquan/git-del-branches"
exclude = [".github", "debian", "screenshot.png"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
console = { version = "0.16.3", features = ["windows-console-colors"] }
eyre = "0.6.12"
format-bytes = "0.3.0"
git2 = "0.21.0"
git2_credentials = "0.16.0"
human-units = "0.5.3"
inquire = "0.9.4"
verynicetable = "0.6.2"
