# Release asset naming: https://blog.urth.org/2023/04/16/naming-your-binary-executable-releases/
# <project>[-<version>]-<target-triple>.tar.gz (Unix) / .zip (Windows), so that
# https://github.com/houseabsolute/ubi can pick the right artifact for a platform.
on: [push]

name: CI

jobs:
  build:
    name: git-del-branches-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Set up musl build
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Build
        run: cargo build --release --all-features --target ${{ matrix.target }} --target-dir out
      - name: Package release archive
        shell: bash
        env:
          TRIPLE: ${{ matrix.target }}
        run: |
          version=
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="-${GITHUB_REF_NAME#v}"
          fi
          archive="git-del-branches${version}-${TRIPLE}"
          mkdir -p out/package
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "out/${TRIPLE}/release/git-del-branches.exe" out/package/
            (cd out/package && 7z a "../${archive}.zip" git-del-branches.exe)
          else
            cp "out/${TRIPLE}/release/git-del-branches" out/package/
            tar -czf "out/${archive}.tar.gz" -C out/package git-del-branches
          fi
      - name: Archive built files
        uses: actions/upload-artifact@v4
        with:
          name: git-del-branches_${{ matrix.target }}
          path: |
            out/git-del-branches-*.tar.gz
            out/git-del-branches-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
